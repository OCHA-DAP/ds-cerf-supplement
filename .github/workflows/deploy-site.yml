name: Deploy site

# Deploys the static page to GitHub Pages from the site data the daily Databricks
# job leaves on the dev blob (projects/ds-cerf-supplement/site/data.json). This
# runner never talks to the DB: the DB lost public network access in 2026-09, so
# the whole refresh -> match -> export chain moved to the Databricks job
# "CERF Supplement Daily" (databricks.yml), whose last step uploads data.json and
# dispatches this workflow. Also runs on push to the site/script files, on
# demand, and once daily as a backstop in case the dispatch didn't fire.
on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "scripts/fetch_site_data.py"
      - "src/site_blob.py"
      - ".github/workflows/deploy-site.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Install
        run: |
          uv venv --python 3.12
          uv pip install --no-sources -e .

      - name: Fetch data.json from the blob
        env:
          DSCI_AZ_BLOB_DEV_SAS: ${{ secrets.DSCI_AZ_BLOB_DEV_SAS }}
        run: |
          test -n "$DSCI_AZ_BLOB_DEV_SAS" || { echo "::error::DSCI_AZ_BLOB_DEV_SAS org secret is not visible to this repo"; exit 1; }
          uv run --no-sync python scripts/fetch_site_data.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
